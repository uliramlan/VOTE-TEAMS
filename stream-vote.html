<script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const overlay = document.getElementById('status-overlay');
        const statusMessage = document.getElementById('status-message');
        const timerText = document.getElementById('timer-text');
        const votingArea = document.getElementById('voting-area');
        
        let countdownInterval = null;

        // Check if this device already voted previously
        if (localStorage.getItem('has_stream_voted') === 'true') {
            lockScreen("You have already voted from this device!");
        }

        socket.on('streamTimerStatus', (data) => {
            clearInterval(countdownInterval);

            if (data.active) {
                // Only remove overlay if they haven't already voted
                if (localStorage.getItem('has_stream_voted') !== 'true') {
                    overlay.classList.add('hidden');
                }
                startCountdown(data.endTime);
            } else {
                overlay.classList.remove('hidden');
                statusMessage.textContent = "Stream voting is currently closed.";
                timerText.textContent = "";
            }
        });

        socket.on('voteRejected', (msg) => {
            alert(msg);
        });

        socket.on('voteSuccess', (msg) => {
            localStorage.setItem('has_stream_voted', 'true');
            lockScreen("Vote recorded successfully! Thank you.");
            alert(msg);
        });

        function castVote(teamKey) {
            if (localStorage.getItem('has_stream_voted') === 'true') {
                alert("You can only vote once!");
                return;
            }
            socket.emit('castStreamVote', teamKey);
        }

        function lockScreen(message) {
            overlay.classList.remove('hidden');
            statusMessage.textContent = message;
            timerText.textContent = "";
            votingArea.style.pointerEvents = 'none';
            votingArea.style.opacity = '0.5';
        }

        function startCountdown(endTime) {
            if (localStorage.getItem('has_stream_voted') === 'true') return;

            const updateTimer = () => {
                const remaining = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
                
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    overlay.classList.remove('hidden');
                    statusMessage.textContent = "Stream voting has ended!";
                    timerText.textContent = "";
                    return;
                }

                const minutes = Math.floor(remaining / 60);
                const seconds = remaining % 60;
                timerText.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            };

            updateTimer();
            countdownInterval = setInterval(updateTimer, 1000);
        }
    </script>
