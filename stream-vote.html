<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Viewer Vote</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; background-color: #111; }
        .split-container { display: flex; height: 100vh; width: 100vw; flex-direction: row; transition: opacity 0.3s; }
        .team-side { flex: 1; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: filter 0.2s ease-in-out; -webkit-tap-highlight-color: transparent; user-select: none; }
        .team-side:hover { filter: brightness(1.15); }
        .team-side img { max-width: 60%; max-height: 60%; object-fit: contain; transition: transform 0.1s; pointer-events: none; }
        .team-side:active img { transform: scale(0.9); }
        .team-red { background-color: #1a1a2e; }
        .team-blue { background-color: #f1faee; }
        
        #status-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); color: white; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            font-size: 28px; z-index: 999; text-align: center; padding: 20px;
        }
        .hidden { display: none !important; }
        #timer-text { font-size: 40px; color: #ffcc00; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="status-overlay">
        <div id="status-message">Waiting for host to open stream voting...</div>
        <div id="timer-text"></div>
    </div>

    <div class="split-container" id="voting-area">
        <div class="team-side team-red" onclick="castVote('red')">
            <img src="static/logo team/GM.png" alt="Team Red">
        </div>
        <div class="team-side team-blue" onclick="castVote('blue')">
            <img src="static/logo team/OMPED.png" alt="Team Blue">
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Force direct WebSocket connection (bypasses HTTP polling overhead)
        const socket = io({
            transports: ['websocket']
        });
        
        const overlay = document.getElementById('status-overlay');
        const statusMessage = document.getElementById('status-message');
        const timerText = document.getElementById('timer-text');
        
        let countdownInterval = null;

        let voterToken = localStorage.getItem('stream_voter_token');
        if (!voterToken) {
            voterToken = 'token_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
            localStorage.setItem('stream_voter_token', voterToken);
        }

        socket.on('connect', () => {
            socket.emit('checkVoterToken', voterToken);
        });

        socket.on('sessionReset', () => {
            localStorage.removeItem('has_voted');
        });

        socket.on('streamTimerStatus', (data) => {
            clearInterval(countdownInterval);

            if (data.active) {
                if (localStorage.getItem('has_voted') === 'true') {
                    lockScreen("You have already cast your stream vote from this device!");
                    return;
                }
                overlay.classList.add('hidden');
                startCountdown(data.endTime);
            } else {
                overlay.classList.remove('hidden');
                statusMessage.textContent = "Stream voting is currently closed.";
                timerText.textContent = "";
            }
        });

        socket.on('voteRejected', (msg) => {
            lockScreen(msg);
        });

        socket.on('voteSuccess', (msg) => {
            localStorage.setItem('has_voted', 'true');
            lockScreen("You have already cast your stream vote from this device!");
        });

        socket.on('alreadyVoted', () => {
            localStorage.setItem('has_voted', 'true');
            lockScreen("You have already cast your stream vote from this device!");
        });

        function castVote(teamKey) {
            if (localStorage.getItem('has_voted') === 'true') {
                lockScreen("You have already cast your stream vote from this device!");
                return;
            }
            socket.emit('castStreamVote', { team: teamKey, token: voterToken });
        }

        function lockScreen(message) {
            clearInterval(countdownInterval);
            overlay.classList.remove('hidden');
            statusMessage.textContent = message;
            timerText.textContent = "";
        }

        function startCountdown(endTime) {
            if (localStorage.getItem('has_voted') === 'true') {
                lockScreen("You have already cast your stream vote from this device!");
                return;
            }

            const updateTimer = () => {
                const remaining = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
                
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    overlay.classList.remove('hidden');
                    statusMessage.textContent = "Stream voting has ended!";
                    timerText.textContent = "";
                    return;
                }

                const minutes = Math.floor(remaining / 60);
                const seconds = remaining % 60;
                timerText.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            };

            updateTimer();
            countdownInterval = setInterval(updateTimer, 1000);
        }
    </script>
</body>
</html>
