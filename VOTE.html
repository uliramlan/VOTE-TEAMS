<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Vote : VENUE</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        .split-container { display: flex; height: 100vh; width: 100vw; flex-direction: row; }
        .team-side { flex: 1; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: filter 0.2s ease-in-out; -webkit-tap-highlight-color: transparent; user-select: none; }
        .team-side:hover { filter: brightness(1.15); }
        .team-side img { max-width: 60%; max-height: 60%; object-fit: contain; transition: transform 0.1s; pointer-events: none; }
        .team-side:active img { transform: scale(0.9); }
        .team-red { background-color: #1a1a2e; }
        .team-blue { background-color: #f1faee; }
        @media (max-width: 768px) { .split-container { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="split-container">
        <div class="team-side team-red" onclick="castVote('red')">
            <img src="static/logo team/GM.png" alt="Team Red">
        </div>
        <div class="team-side team-blue" onclick="castVote('blue')">
            <img src="static/logo team/OMPED.png" alt="Team Blue">
        </div>
    </div>

    <!-- Import Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        function castVote(teamKey) {
            socket.emit('castVote', teamKey);
        }
    </script>
</body>
</html>
